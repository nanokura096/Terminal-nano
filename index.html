<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>███ TERMINAL</title>

<!-- ★ここが重要：CSS読み込み -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ログイン画面 -->
<div id="loginScreen">
  <h1>ACCESS TERMINAL</h1>

  <input id="username" placeholder="USERNAME">
  <input id="password" type="password" placeholder="PASSWORD">

  <button onclick="login()">LOGIN</button>
  <div id="loginError"></div>
</div>

<!-- 起動画面 -->
<div id="bootScreen"></div>

<!-- メイン -->
<div id="mainTerminal" style="display:none;">

  <div id="statusbar"></div>

  <input id="staffId" placeholder="FILE ID">
  <input id="clearance" placeholder="CLEARANCE">

  <button onclick="searchFile()">SEARCH</button>

  <div id="tabs">
    <button onclick="showTab('personnel')">PERSONNEL</button>
    <button onclick="showTab('ability')">ABILITY</button>
    <button onclick="showTab('███')">███</button>
    <button onclick="showTab('record')">RECORD</button>
  </div>

  <div id="result"></div>

  <div id="staffList"></div>

  <button onclick="toggleStaffList()">TOGGLE STAFF</button>

</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
