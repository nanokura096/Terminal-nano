<div id="loginScreen">
  <div id="loginBox">
    <div id="loginTitle">AUTHENTICATION REQUIRED</div>

    <input type="text" id="username" placeholder="[USER ID]" autocomplete="off">
    <input type="password" id="password" placeholder="[REDACTED]" autocomplete="off">

    <button onclick="login()">ACCESS</button>

    <div id="loginError"></div>
  </div>
</div>

<div id="bootScreen"></div>

<div id="mainTerminal" style="display:none;">

  <div id="logo">███ FOUNDATION PERSONNEL TERMINAL</div>

  <div id="statusbar"></div>

  <div class="inputArea">
    <input type="text" id="staffId" placeholder="STAFF ID">

    <select id="clearance">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <button onclick="searchFile()">SEARCH DATABASE</button>
  </div>

  <div id="tabs" style="display:none;">
    <button onclick="showTab('personnel')">PERSONNEL</button>
    <button onclick="showTab('ability')">ABILITY</button>
    <button onclick="showTab('scp')">SCP</button>
    <button onclick="showTab('record')">RECORD</button>
  </div>

  <div id="result"></div>

  <div id="staffListTitle" onclick="toggleStaffList()">
    ▼ REGISTERED STAFF LIST
  </div>

  <div id="staffList"></div>

</div>
