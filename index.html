<<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SCP TERMINAL</title>

  <!-- CSS読み込み -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ログイン画面 -->
<div id="loginScreen">
  <h1>SCP ACCESS TERMINAL</h1>

  <input id="username" placeholder="USERNAME">
  <input id="password" type="password" placeholder="PASSWORD">

  <button onclick="login()">LOGIN</button>

  <div id="loginError"></div>
</div>

<!-- 起動画面 -->
<div id="bootScreen"></div>

<!-- メイン画面 -->
<div id="mainTerminal" style="display:none;">

  <div id="statusbar"></div>

  <div>
    <input id="staffId" placeholder="FILE ID">
    <input id="clearance" placeholder="CLEARANCE LEVEL">
    <button onclick="searchFile()">SEARCH</button>
  </div>

  <div id="tabs">
    <button onclick="showTab('personnel')">PERSONNEL</button>
    <button onclick="showTab('ability')">ABILITY</button>
    <button onclick="showTab('scp')">SCP</button>
    <button onclick="showTab('record')">RECORD</button>
  </div>

  <div id="result"></div>

  <button onclick="toggleStaffList()">TOGGLE STAFF LIST</button>
  <div id="staffList"></div>

</div>

<!-- JS読み込み -->
<script src="script.js"></script>

</body>

</html>
